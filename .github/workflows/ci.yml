name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7
    
    - name: Install clang-format (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install clang-format || true

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Lint with clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build workspace
      run: cargo build --workspace --all-targets

    - name: Run tests
      run: cargo test --workspace

  linux_distros:
    name: Build & Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian:latest, fedora:latest, archlinux:latest]
    container:
      image: ${{ matrix.distro }}
    
    steps:
    - name: Install dependencies (Debian)
      if: startsWith(matrix.distro, 'debian')
      run: apt-get update && apt-get install -y git curl build-essential pkg-config libssl-dev cmake clang-format

    - name: Install dependencies (Fedora)
      if: startsWith(matrix.distro, 'fedora')
      run: dnf install -y git curl gcc gcc-c++ make openssl-devel perl findutils cmake clang-tools-extra

    - name: Install dependencies (Arch)
      if: startsWith(matrix.distro, 'archlinux')
      run: pacman -Syu --noconfirm && pacman -S --noconfirm git curl gcc base-devel openssl cmake clang

    - uses: actions/checkout@v7

    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable -c clippy -c rustfmt
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Lint with clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build workspace
      run: cargo build --workspace --all-targets

    - name: Run tests
      run: cargo test --workspace

  check_links:
    name: Check Relative Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all relative markdown links
        run: |
          python3 -c "
          import os, re, sys
          from pathlib import Path

          md_files = [Path('README.md')] + list(Path('docs').glob('**/*.md'))
          broken = []
          link_re = re.compile(r'\[.*?\]\((?!https?://|mailto:|#)(.*?)\)')

          for file in md_files:
              content = file.read_text(encoding='utf-8')
              for match in link_re.finditer(content):
                  raw_link = match.group(1).split('#')[0].strip()
                  if not raw_link:
                      continue
                  target = (file.parent / raw_link).resolve()
                  if not target.exists():
                      broken.append((str(file), raw_link))

          if broken:
              print('Broken relative links found:')
              for src, lnk in broken:
                  print(f'  {src} -> {lnk}')
              sys.exit(1)
          print(f'Successfully verified relative links across {len(md_files)} markdown files!')
          "
