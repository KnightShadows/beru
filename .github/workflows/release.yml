name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and Upload Binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: beru
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies for Linux packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems rpm libarchive-tools
          sudo gem install fpm
      - name: Build and upload Linux packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p package/usr/bin
          cp target/${{ matrix.target }}/release/beru package/usr/bin/
          
          fpm -s dir -t deb -n beru -v $VERSION -C package usr/bin/beru
          fpm -s dir -t rpm -n beru -v $VERSION -C package usr/bin/beru
          fpm -s dir -t pacman -n beru -v $VERSION -C package usr/bin/beru
          
          gh release upload ${{ github.ref_name }} *.deb *.rpm *.pkg.tar.zst
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
